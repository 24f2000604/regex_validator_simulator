[package]
name = "regex_validator_simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"

# xattr 0.2.3 (pulled in by gpui's http client) uses libc::ENOATTR, which newer
# libc releases dropped on Linux. Vendored copy maps it to ENODATA (same value).
[patch.crates-io]
xattr = { path = "vendor/xattr" }
